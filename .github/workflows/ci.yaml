name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain and components that rust-toolchain.toml names.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -Wclippy::indexing_slicing
      - run: cargo test --locked
