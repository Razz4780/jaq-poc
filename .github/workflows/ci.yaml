name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain and components that rust-toolchain.toml names.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -Wclippy::indexing_slicing
      - run: cargo test --locked
      # Again under Docker's default seccomp profile, which is what containers usually run with.
      - name: cargo test, in a container
        run: |
          binary=$(cargo test --locked --no-run --test sandbox --message-format=json \
            | jq -r 'select(.executable != null) | .executable')
          # `--init`: as PID 1, the tests would adopt the orphans of the service they let die.
          docker run --rm --init -v "$binary:/sandbox:ro" ubuntu:24.04 /sandbox
