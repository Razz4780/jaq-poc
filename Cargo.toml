[package]
name = "jq-sandbox"
version = "0.1.0"
edition = "2024"
description = "Evaluates untrusted jq filters in forked worker processes, under CPU, memory and stack limits"
publish = false

[dependencies]
caps = "0.5"
jaq-core = "2.2.1"
jaq-json = { version = "1.1.3", features = ["serde_json"] }
jaq-std = "2.1.2"
libc = "0.2"
nix = { version = "0.31", features = ["env", "fs", "process", "resource", "signal", "socket", "time", "uio"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "sandbox"
harness = false

# jaq is several times slower unoptimized, which would turn the tests' memory and stack bombs into
# CPU-time ones.
[profile.dev.package."*"]
opt-level = 3
