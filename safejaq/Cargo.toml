[package]
name = "safejaq"
edition.workspace = true
version.workspace = true

[dependencies]
nix = { version = "0.31", features = ["signal"] }
safejaq-evaluator = { path = "../safejaq-evaluator", artifact = "bin:safejaq_evaluator" }
safejaq-types.path = "../safejaq-types"
serde_json.workspace = true
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing = "0.1"
